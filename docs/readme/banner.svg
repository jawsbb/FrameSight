<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t">
  <title id="t">FrameSight, a Warframe companion</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1c2129"/>
      <stop offset="0.55" stop-color="#111419"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a0"/>
      <stop offset="0.5" stop-color="#d8b04a"/>
      <stop offset="1" stop-color="#8f6d24"/>
    </linearGradient>
    <linearGradient id="fadeL" gradientUnits="userSpaceOnUse" x1="548" y1="0" x2="250" y2="0">
      <stop offset="0" stop-color="#d8b04a"/>
      <stop offset="1" stop-color="#d8b04a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="voidGlow">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#5f9fdb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5f9fdb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#e8ebef" stroke-opacity="0.025"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- One wing of the Orokin filigree, mirrored to the right and below -->
    <g id="wing" fill="none" stroke-linecap="round">
      <line x1="548" y1="145" x2="250" y2="145" stroke="url(#fadeL)" stroke-width="1.5"/>
      <path d="M548 145 C 505 145 505 118 462 118 L 330 118" stroke="url(#fadeL)" stroke-width="1" opacity="0.6"/>
      <path d="M520 138 L 527 145 L 520 152 L 513 145 Z" fill="#d8b04a" stroke="none"/>
      <path d="M478 136 L 469 145 L 478 154" stroke="#d8b04a" stroke-width="1.5"/>
      <path d="M466 136 L 457 145 L 466 154" stroke="#d8b04a" stroke-width="1" opacity="0.6"/>
      <circle cx="400" cy="118" r="2.5" fill="#d8b04a" stroke="none" opacity="0.7"/>
    </g>
  </defs>

  <style>
    .ring { transform-origin: 640px 145px; animation: spin 60s linear infinite; }
    .ring-r { transform-origin: 640px 145px; animation: spin 90s linear infinite reverse; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .scan { animation: scan 6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes scan { 0%, 100% { transform: translateX(-38px); } 50% { transform: translateX(38px); } }
    @media (prefers-reduced-motion: reduce) { .ring, .ring-r, .pulse, .scan { animation: none; } }
  </style>

  <rect width="1280" height="400" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="14" fill="url(#hatch)"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#6a727e" stroke-width="1.5">
    <path d="M28 70 V28 H70"/><path d="M1252 70 V28 H1210"/>
    <path d="M28 330 V372 H70"/><path d="M1252 330 V372 H1210"/>
  </g>
  <g fill="#8c939d" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="3">
    <text x="84" y="42">// CODEX ENTRY</text>
    <text x="1196" y="42" text-anchor="end">VOID SIGNAL ◇ STABLE</text>
  </g>

  <!-- Filigree -->
  <use xlink:href="#wing"/>
  <use xlink:href="#wing" transform="translate(1280 0) scale(-1 1)"/>
  <use xlink:href="#wing" transform="translate(0 290) scale(1 -1)" opacity="0.55"/>
  <use xlink:href="#wing" transform="translate(1280 290) scale(-1 -1)" opacity="0.55"/>

  <!-- Emblem: an Orokin eye -->
  <circle class="ring" cx="640" cy="145" r="104" fill="none" stroke="#d8b04a" stroke-width="1" stroke-dasharray="2 9" opacity="0.55"/>
  <circle class="ring-r" cx="640" cy="145" r="92" fill="none" stroke="#e8ebef" stroke-width="0.75" stroke-dasharray="40 14 4 14" opacity="0.25"/>
  <g fill="none" stroke="url(#gold)">
    <path d="M640 62 L723 145 L640 228 L557 145 Z" stroke-width="2"/>
    <path d="M640 86 L699 145 L640 204 L581 145 Z" stroke-width="1" opacity="0.5"/>
    <line x1="640" y1="20" x2="640" y2="58" stroke-width="1.5"/>
    <line x1="640" y1="232" x2="640" y2="262" stroke-width="1.5"/>
  </g>
  <path d="M640 12 L647 20 L640 28 L633 20 Z" fill="url(#gold)"/>
  <path d="M598 145 Q640 106 682 145 Q640 184 598 145 Z" fill="#0b0d10" stroke="#e8ebef" stroke-width="1.5"/>
  <circle class="pulse" cx="640" cy="145" r="40" fill="url(#voidGlow)"/>
  <g class="scan">
    <circle cx="640" cy="145" r="16" fill="#5f9fdb29" stroke="#5f9fdb" stroke-width="1.5"/>
    <circle cx="640" cy="145" r="6" fill="#bfe0ff" filter="url(#soft)"/>
  </g>

  <!-- Wordmark -->
  <text x="651" y="318" text-anchor="middle" fill="#e8ebef" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="300" letter-spacing="22" filter="url(#soft)">FRAMESIGHT</text>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="643" y="350" fill="#d8b04a" font-size="14" letter-spacing="6">WARFRAME COMPANION ◇ LINUX ◇ WINDOWS ◇ STEAM DECK</text>
    <text x="642" y="374" fill="#8c939d" font-size="11" letter-spacing="4">NO OVERWOLF · NO ACCOUNT · NO TELEMETRY</text>
  </g>
</svg>
