name: Issue labeler
on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.issue.body || '';
            const labels = [];

            // Area labels from the "Which part" dropdown
            const areaMap = {
              'Inventory acquisition': 'area:acquisition',
              'Reward overlay': 'area:ocr',
              'Pricing': 'area:acquisition',
              'Catalog / artwork': 'area:acquisition',
              'Log monitor / health reporting': 'area:monitor',
              'Build or packaging': 'area:app',
            };
            for (const [keyword, label] of Object.entries(areaMap)) {
              if (body.includes(keyword)) {
                labels.push(label);
                break;
              }
            }

            // Platform labels from the "Platform" dropdown
            if (body.includes('### Platform\n\nLinux')) labels.push('platform:linux');
            if (body.includes('### Platform\n\nWindows')) labels.push('platform:windows');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
