<div class="kiosk" aria-label="{{=kiosk.alt}}">
  <div class="kiosk-screen">
    <div class="kiosk-grid">
      <button type="button" class="kiosk-tile" aria-pressed="true" data-name="Euphona Prime Receiver" data-p="25" data-d="100"><span class="plate" style="--i:0"><img class="metal-mark" src="/assets/platinum.png" alt="" width="20" height="20">25p</span><i class="game-art" style="--art:url(/assets/parts/gun-receiver.png)"></i><span class="game-name">Euphona Prime Receiver</span></button>
      <button type="button" class="kiosk-tile" aria-pressed="false" data-name="Kompressa Prime Barrel" data-p="8" data-d="45"><span class="plate" style="--i:1"><img class="metal-mark" src="/assets/platinum.png" alt="" width="20" height="20">8p</span><span class="plate word" style="--i:1">Unmastered</span><i class="game-art" style="--art:url(/assets/parts/gun-barrel.png)"></i><span class="game-name">Kompressa Prime Barrel</span></button>
      <button type="button" class="kiosk-tile" aria-pressed="true" data-name="Titania Prime Systems Blueprint" data-p="33" data-d="100"><span class="plate" style="--i:2"><img class="metal-mark" src="/assets/platinum.png" alt="" width="20" height="20">33p</span><i class="game-art" style="--art:url(/assets/parts/warframe-system.png)"></i><span class="game-name">Titania Prime Systems Blueprint</span></button>
      <button type="button" class="kiosk-tile" aria-pressed="false" data-name="Nekros Prime Chassis Blueprint" data-p="12" data-d="45"><span class="plate" style="--i:3"><img class="metal-mark" src="/assets/platinum.png" alt="" width="20" height="20">12p</span><i class="game-art" style="--art:url(/assets/parts/warframe-chassis.png)"></i><span class="game-name">Nekros Prime Chassis Blueprint</span></button>
      <button type="button" class="kiosk-tile" aria-pressed="false" data-name="Afentis Prime Blade" data-p="10" data-d="45"><span class="plate" style="--i:4"><img class="metal-mark" src="/assets/platinum.png" alt="" width="20" height="20">10p</span><span class="plate word" style="--i:4">Unmastered</span><i class="game-art" style="--art:url(/assets/parts/weapon-blade.png)"></i><span class="game-name">Afentis Prime Blade</span></button>
      <button type="button" class="kiosk-tile" aria-pressed="true" data-name="Panthera Prime Barrel" data-p="21" data-d="100"><span class="plate" style="--i:5"><img class="metal-mark" src="/assets/platinum.png" alt="" width="20" height="20">21p</span><i class="game-art" style="--art:url(/assets/parts/gun-barrel.png)"></i><span class="game-name">Panthera Prime Barrel</span></button>
      <button type="button" class="kiosk-tile" aria-pressed="false" data-name="Hystrix Prime Receiver" data-p="19" data-d="45"><span class="plate" style="--i:6"><img class="metal-mark" src="/assets/platinum.png" alt="" width="20" height="20">19p</span><i class="game-art" style="--art:url(/assets/parts/gun-receiver.png)"></i><span class="game-name">Hystrix Prime Receiver</span></button>
      <button type="button" class="kiosk-tile" aria-pressed="false" data-name="Kronen Prime Handle" data-p="7" data-d="45"><span class="plate" style="--i:7"><img class="metal-mark" src="/assets/platinum.png" alt="" width="20" height="20">7p</span><i class="game-art" style="--art:url(/assets/parts/weapon-hilt.png)"></i><span class="game-name">Kronen Prime Handle</span></button>
    </div>
    <div class="kiosk-list" aria-live="polite">
      <p class="kiosk-head">{{kiosk.list}}</p>
      <ol></ol>
      <div class="kiosk-total"><span>Total</span><span class="plate"><img class="metal-mark" src="/assets/platinum.png" alt="" width="20" height="20"><b data-total="p">79</b>p</span><span class="d-fig"><img class="metal-mark" src="/assets/ducats.png" alt="" width="16" height="20"><b data-total="d">300</b></span></div>
    </div>
  </div>
</div>
