<section class="faq" aria-labelledby="faq-title">
  <div class="faq-head">
    <p class="eyebrow"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg>FAQ</p>
    <h2 id="faq-title" data-split>{{faq.title}}</h2>
  </div>
  <div class="faq-list card" data-reveal>{{faqHtml}}
  </div>
</section>

<section class="related" aria-labelledby="related-title">
  <h2 id="related-title">{{related.title}}</h2>
  <div class="related-grid">{{relatedCards}}
  </div>
</section>

{{>closer}}
